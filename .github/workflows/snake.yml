name: Pink Coquette Snake

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: massy-coder
          outputs: |
            dist/coquette-snake.svg?color_snake=%23FF69B4&color_dots=%23FFF0F6%2C%23FFD6E7%2C%23FFB6D5%2C%23FF85B8%2C%23FF69B4

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
